name: Kinora static judge preview
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/heritage-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/heritage-bridge/package-lock.json
      - run: npm ci
      - run: npm run catalogue:check
      - run: npm run build:static
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/heritage-bridge/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed static bundle
        id: deployment
        uses: actions/deploy-pages@v4
